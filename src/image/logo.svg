<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" width="100" height="60">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- G in dark blue -->
  <text x="10" y="42" font-family="'Times New Roman', Times, serif" font-weight="bold" font-size="34" fill="#00154D" filter="url(#shadow)">G</text>
  
  <!-- Big P in red -->
  <text x="35" y="46" font-family="'Times New Roman', Times, serif" font-weight="bold" font-size="46" fill="#FF0000" filter="url(#shadow)">P</text>
  
  <!-- A in red -->
  <text x="65" y="42" font-family="'Times New Roman', Times, serif" font-weight="bold" font-size="34" fill="#FF0000" filter="url(#shadow)">A</text>
</svg>
